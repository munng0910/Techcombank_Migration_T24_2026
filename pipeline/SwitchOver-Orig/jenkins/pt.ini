# PT cluster (dev) - 4 nodes. Replace the placeholder IPs with real ones.
[t24node1]
10.38.142.47 ansible_password="{{ t24node1_ansible_password }}"

[t24node2]
10.38.142.55 ansible_password="{{ t24node2_ansible_password }}"

[t24node3]
10.38.142.114 ansible_password="{{ t24node3_ansible_password }}"

[t24node4]
10.38.142.81 ansible_password="{{ t24node4_ansible_password }}"

[ogg_DC]
10.38.94.231 ansible_password="{{ ogg_ansible_password }}"

[ogg_DR]
10.38.94.232 ansible_password="{{ ogg_ansible_password }}"

[db_t24live:children]
t24node1
t24node2
t24node3
t24node4
ogg_DC
ogg_DR

[db_t24live:vars]
ansible_port=22
ansible_user=localpwm
db_unique_name=t24cdbpt
# PDB name for CDB clusters. Leave unset (or empty) for non-CDB clusters.
pdb_name=t24pdb
# Planned-maintenance service drain (step D1), in seconds.
drain_timeout=300
# Password-based SSH in an ephemeral pod has no known_hosts, so disable host key
# checking (sshpass cannot accept a new fingerprint interactively).
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
